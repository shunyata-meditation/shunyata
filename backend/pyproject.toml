[project]
name = "shunyata-backend"
version = "0.1.0"
description = "Backend server for Shunyata meditation app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.5",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.0",
    "drf-spectacular>=0.27.0",
    "python-dotenv>=1.2.2",
    "psycopg2-binary>=2.9.10",
    "gunicorn>=23.0.0",
    "whitenoise>=6.9.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.0.0",
    "djangorestframework-stubs[compatible-mypy]>=3.0.0",
]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "shunyata_backend.settings"
